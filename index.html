<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Beast Movers</title>
    <meta name="description" content="Co-op moving chaos for 1–8 players, right in your browser." />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1d1b26;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
        /* Không cuộn / phóng to trang bằng cử chỉ khi chơi trên điện thoại. */
        touch-action: none;
      }
      #rotate {
        display: none;
      }
      /* Điện thoại cầm dọc: nhắc xoay ngang (game vẽ 16:9). */
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: flex;
          position: fixed;
          inset: 0;
          z-index: 20;
          align-items: center;
          justify-content: center;
          flex-direction: column;
          gap: 12px;
          background: #1d1b26;
          color: #f4efe6;
          font-family: Nunito, 'Segoe UI', Roboto, Arial, sans-serif;
          font-size: 20px;
          text-align: center;
          padding: 24px;
        }
        #rotate .icon {
          font-size: 64px;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">
      <div class="icon">📱↻</div>
      <div>Xoay ngang điện thoại để chơi</div>
      <div>Turn your phone sideways to play</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
